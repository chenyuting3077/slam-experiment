# Official FAST_LIO on the Compal AMR merged Vanjee cloud (4 rings), converted by convert_lab_bag_for_fastlio.py
common:
    lid_topic:  "/velodyne_points"
    imu_topic:  "/imu/data"
    time_sync_en: false
    time_offset_lidar_to_imu: 0.0

preprocess:
    lidar_type: 2                # Velodyne layout (per-point 'time' f32 seconds, 'ring' u16)
    scan_line: 4
    scan_rate: 20
    timestamp_unit: 0            # 'time' is in seconds
    blind: 0.5

mapping:
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    fov_degree:    360
    det_range:     100.0
    extrinsic_est_en:  false
    # lidar(base_link) position in the IMU frame = -(base_link->imu_link translation of /tf_static)
    extrinsic_T: [ -0.126591709191942, 0.0, -0.077026079810353 ]
    extrinsic_R: [ 1, 0, 0,
                   0, 1, 0,
                   0, 0, 1 ]

publish:
    path_en:  true
    scan_publish_en:  true
    dense_publish_en: true
    scan_bodyframe_pub_en: true

pcd_save:
    pcd_save_en: true
    interval: -1

common:
    lid_topic:  "/points_raw"
    imu_topic:  "/imu_correct"
    time_sync_en: false
    time_offset_lidar_to_imu: 0.0

preprocess:
    lidar_type: 2                # Velodyne
    scan_line: 16                # VLP-16
    scan_rate: 10
    timestamp_unit: 0            # per-point 'time' field is in seconds (verified from raw bag data)
    blind: 0.5

mapping:
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    fov_degree:    360.0          # VLP-16 is a full 360-degree rotating scanner, not the 180 in the stock template
    det_range:     100.0
    extrinsic_est_en:  false
    # /imu_correct is already pre-rotated into the lidar-aligned frame by
    # LIO-SAM's own imuConverter (extrinsicTrans=[0,0,0]), so identity here.
    extrinsic_T: [ 0, 0, 0 ]
    extrinsic_R: [ 1, 0, 0,
                   0, 1, 0,
                   0, 0, 1]

publish:
    path_en:  true
    scan_publish_en:  true
    dense_publish_en: true
    scan_bodyframe_pub_en: true

pcd_save:
    pcd_save_en: true
    interval: -1
